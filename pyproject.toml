[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-anchor"
version = "0.1.0"
description = "Text-free SRT translation checks for preserved cue identity and timeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
caption-anchor = "caption_anchor:main"

[project.urls]
Homepage = "https://github.com/KanadeK/caption-anchor"
Issues = "https://github.com/KanadeK/caption-anchor/issues"

[tool.setuptools]
py-modules = ["caption_anchor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
